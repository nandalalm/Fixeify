# Host Nginx (on the VM, outside Docker). Copy to /etc/nginx/sites-available/fixeify,
# replace YOUR_DOMAIN, then run certbot --nginx -d YOUR_DOMAIN to add HTTPS.
#
#   https://YOUR_DOMAIN/            -> frontend container (127.0.0.1:3000)
#   https://YOUR_DOMAIN/api/...     -> backend container  (127.0.0.1:5000)
#   https://YOUR_DOMAIN/socket.io/  -> backend container  (websockets)

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name YOUR_DOMAIN;

  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
